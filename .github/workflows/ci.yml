name: CI/CD Pipeline

on: # execution with push and pull of main
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test: # vm for testing
    runs-on: ubuntu-latest

    steps: # validation steps
      - name: Checkout of Source Code
        uses: actions/checkout@v4 
        with:
          fetch-depth: 0

      - name: Validate Conventional Commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          REGEX="^(feat|fix|docs|refactor|chore|style|test|perf|ci|build|revert)(\(.+\))?: .+"
          if [[ ! $COMMIT_MSG =~ $REGEX ]]; then
            echo "Error: Commit'$COMMIT_MSG' doesn't follow the convention (feat, fix, docs, refactor, chore, test...)."
            exit 1
          fi

      - name: Flutter Setup
        uses: subosito/flutter-action@v2 
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get 

      - name: Verifiy Format
        run: dart format --output=none --set-exit-if-changed . 

      - name: Execute Linter
        run: flutter analyze 

      - name: Execute Unit Tests
        run: flutter test 