include: package:flutter_lints/flutter.yaml # analisis estatico

analyzer: # settings for linting motor
  exclude: # excluded folders
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - .dart_tool/** #

linter: # style rules
  rules: 
    avoid_print: true # disable prints for logs
    prefer_single_quotes: true # disable double quotation marks
    require_trailing_commas: true # comas after every line
    prefer_const_constructors: true # const to instantiate widgets
    prefer_const_declarations: true # const for local variables
    sort_child_properties_last: true # last element of widget is the child
    unrelated_type_equality_checks: true # logic errors
    always_declare_return_types: true # declare types on functions
    use_build_context_synchronously: true # validate the wigdet before async function